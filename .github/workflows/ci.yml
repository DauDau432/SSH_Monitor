name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # App chỉ chạy trên Windows (setConsoleTitle, hộp thoại chọn file, icon exe)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # Giữ LF khi checkout, nếu không gofmt sẽ báo mọi file (CRLF)
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...
