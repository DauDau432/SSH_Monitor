<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal — SSH Monitor</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; background: #020817; overflow: hidden; }
        body { display: flex; flex-direction: column; font-family: 'JetBrains Mono', 'Consolas', monospace; }

        .term-bar {
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 14px;
            background: #0e1422;
            border-bottom: 1px solid #232d42;
            color: #e2e8f0;
            font-size: 0.82rem;
        }
        .term-bar .dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #22c55e;
            box-shadow: 0 0 6px rgba(34,197,94,0.7);
        }
        .term-bar .dot.offline { background: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.7); }
        .term-bar .dot.connecting { background: #eab308; box-shadow: 0 0 6px rgba(234,179,8,0.7); }
        .term-bar #term-title { font-weight: 700; }
        .term-bar #term-status { color: #94a3b8; margin-left: auto; }

        #terminal-container {
            flex: 1 1 auto;
            padding: 6px 8px 8px 10px;
            min-height: 0;
        }
        #terminal-container .xterm { height: 100%; }
    </style>
</head>
<body>
    <div class="term-bar">
        <span class="dot connecting" id="term-dot"></span>
        <span id="term-title">Terminal</span>
        <span id="term-status">Đang kết nối…</span>
    </div>
    <div id="terminal-container"></div>

    <script>
    (() => {
        'use strict';

        const params = new URLSearchParams(location.search);
        const serverID = params.get('id');
        const serverLabel = params.get('label') || serverID || '';
        const serverHost = params.get('host') || '';

        const dot = document.getElementById('term-dot');
        const titleEl = document.getElementById('term-title');
        const statusEl = document.getElementById('term-status');

        const titleText = serverHost && serverHost !== serverLabel
            ? `${serverLabel} (${serverHost})`
            : serverLabel;
        titleEl.textContent = 'Terminal — ' + titleText;
        document.title = 'Terminal — ' + titleText;

        if (!serverID) {
            statusEl.textContent = 'Thiếu server ID';
            dot.className = 'dot offline';
            return;
        }

        const term = new Terminal({
            cursorBlink: true,
            fontSize: 14,
            fontFamily: "'JetBrains Mono', 'Consolas', monospace",
            theme: {
                background: '#020817',
                foreground: '#e2e8f0',
                cursor: '#22d3ee',
                selectionBackground: 'rgba(34,211,238,0.25)'
            },
            scrollback: 5000
        });
        const fitAddon = new FitAddon.FitAddon();
        term.loadAddon(fitAddon);
        term.open(document.getElementById('terminal-container'));
        fitAddon.fit();

        let ws = null;
        let closed = false;

        function setStatus(text, state) {
            statusEl.textContent = text;
            dot.className = 'dot ' + (state || '');
        }

        function sendResize() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
            }
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${location.host}/ws/terminal/${encodeURIComponent(serverID)}`);

            ws.onopen = () => {
                setStatus('Đã kết nối', '');
                term.focus();
                // Gửi kích thước thật của terminal ngay khi kết nối
                sendResize();
            };

            ws.onmessage = (e) => {
                try {
                    const msg = JSON.parse(e.data);
                    if (msg.type === 'output') term.write(msg.data);
                } catch (err) {
                    term.write(e.data);
                }
            };

            ws.onclose = () => {
                if (closed) return;
                setStatus('Mất kết nối', 'offline');
                term.write('\r\n\x1b[33m[Phiên terminal đã đóng]\x1b[0m\r\n');
            };

            ws.onerror = () => setStatus('Lỗi kết nối', 'offline');
        }

        term.onData((data) => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'input', data }));
            }
        });

        // Resize terminal khi đổi kích thước cửa sổ
        let resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                fitAddon.fit();
                sendResize();
            }, 100);
        });

        connect();
    })();
    </script>
</body>
</html>
