        /* Lưu thứ tự group mới */
        async function saveReorderedGroups() {
            const tbody = document.getElementById('groups-mgmt-tbody');
            if (!tbody) return;

            const rows = tbody.querySelectorAll('.draggable-group-row');
            const orderedGroups = Array.from(rows).map(r => r.dataset.group);
            if (orderedGroups.length === 0) return;

            systemGroups = orderedGroups;
            updateClusterSelectors();

            try {
                const res = await fetch('/api/groups/reorder', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ordered_groups: orderedGroups })
                });
                if (!res.ok) throw new Error('Lỗi lưu thứ tự group');
                showToast('Đã lưu thứ tự Group mới');
            } catch (err) {
                showToast(err.message);
            }
        }

        window.toggleRowMenu = function(e, id) {
            e.stopPropagation();
            document.querySelectorAll('.action-dropdown-menu').forEach(m => {
                if (m.id !== `menu-${id}`) m.classList.remove('show');
            });
            const menu = document.getElementById(`menu-${id}`);
            if (menu) menu.classList.toggle('show');
        };

        /* Mở Web Terminal trong tab trình duyệt mới */
        window.openTerminal = function(id, label, host) {
            const url = `/terminal.html?id=${encodeURIComponent(id)}&label=${encodeURIComponent(label || '')}&host=${encodeURIComponent(host || '')}`;
            window.open(url, '_blank');
        };

        document.addEventListener('click', () => {
            document.querySelectorAll('.action-dropdown-menu').forEach(m => m.classList.remove('show'));
        });

        /* ============================================================
           VIEW 3.5: ĐỒNG BỘ FILE (source browser + dest picker + preflight)
           ============================================================ */
        let syncSourceId = '';
        let syncBrowsePath = '';        // thư mục đang duyệt trên máy nguồn
        let syncSelectedPath = '';      // đường dẫn file đã chọn (đồng bộ với ô nhập tay)
        let syncDestIds = new Set();    // tập id máy đích đã tick
        let syncOpenGroups = new Set(); // tập group đang xổ ra (mặc định thu gọn hết)
        let syncSourceOpenGroups = new Set(); // group đang xổ ở khung chọn máy nguồn
        let syncSourceQuery = '';       // từ khóa tìm kiếm máy nguồn
        let syncDestQuery = '';         // từ khóa tìm kiếm máy đích
        let syncDestPathEdited = false; // người dùng đã tự sửa ô đường dẫn đích
        let syncJobId = null;
        let syncPollTimer = null;
        let syncInspectResult = null;   // kết quả /api/sync/inspect gần nhất

        function syncIsOnline(id) {
            const m = metricsMap[id];
            return !!(m && m.status === 'online');
        }

        function syncFormatBytes(b) {
            if (b === null || b === undefined) return '—';
            if (b < 1024) return b + ' B';
            if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
            if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
            return (b / 1073741824).toFixed(2) + ' GB';
        }

        /* Nhóm server theo Group (giữ thứ tự systemGroups) */
        function syncGroupedServers() {
            const order = [];
            const map = {};
            const push = (g) => {
                if (!map[g]) { map[g] = []; order.push(g); }
                return map[g];
            };
            systemGroups.forEach(g => push(g)); // đảm bảo group có trước kể cả rỗng
            serverConfigs.forEach(s => push(s.group || 'Default').push(s));
            return order.map(g => ({ group: g, servers: map[g] })).filter(x => x.servers.length > 0);
        }

        async function renderSyncView(area) {
            // Ngừng polling của job cũ khi render lại trang
            if (syncPollTimer) { clearInterval(syncPollTimer); syncPollTimer = null; }
            syncAreaEl = area;

            if (!serverConfigs.length) {
                area.innerHTML = `<div class="sync-fs-empty">Chưa có server nào. Hãy thêm server ở trang Quản lý Server trước.</div>`;
                return;
            }
            if (syncSourceId && !serverConfigs.some(s => s.id === syncSourceId)) {
                syncSourceId = ''; // không mặc định chọn máy nào — người dùng tự chọn
            }
            syncStep = syncSourceId ? 2 : 1;
            syncRenderStep();
        }

        let syncAreaEl = null;
        let syncStep = 1;

        /* Render theo bước: 1 = chọn máy nguồn, 2 = chọn file + máy đích */
        function syncRenderStep() {
            const area = syncAreaEl;
            if (!area) return;

            const srcServer = serverConfigs.find(s => s.id === syncSourceId);

            let leftHead, leftBody, rightCol = '', actions = '';

            if (syncStep === 1 || !srcServer) {
                /* ---- BƯỚC 1: chọn máy nguồn (chỉ hiện khung chọn, ẩn hết phần dưới) ---- */
                leftHead = `<h3>Bước 1 — Chọn máy nguồn</h3>`;
                leftBody = `
                    <div class="sync-panel-body" style="padding-bottom: 8px;">
                        <label class="field-label">Máy nguồn (chứa file)</label>
                        <input class="sync-search-input" id="sync-source-search" placeholder="🔍 Tìm VPS nguồn (tên, IP, group)…" value="${escapeHTML(syncSourceQuery)}" oninput="syncOnSourceSearch(this.value)">
                        <div id="sync-source-groups" style="margin-top: 8px;"></div>
                    </div>`;
            } else {
                /* ---- BƯỚC 2: duyệt & chọn file trên máy nguồn ---- */
                const srcName = srcServer.label ? `${srcServer.label} — ${srcServer.host}` : srcServer.host;
                leftHead = `
                    <button class="sync-btn-back" onclick="syncBackToSource()" title="Quay lại bước chọn máy nguồn">←</button>
                    <h3>Bước 2 — Chọn file cần đồng bộ</h3>
                    <span class="sync-src-badge"><span class="node-dot ${syncIsOnline(srcServer.id) ? '' : 'offline'}" id="sync-src-dot-${escapeHTML(srcServer.id)}"></span><b>${escapeHTML(srcName)}</b></span>`;
                leftBody = `
                    <div class="sync-fs-toolbar">
                        <button class="sync-btn-ghost" id="sync-fs-up" onclick="syncBrowseUp()" title="Về thư mục cha (cấp trên)">↑ Thư mục cha</button>
                        <button class="sync-btn-ghost" id="sync-fs-home" onclick="syncBrowseTo('')" title="Về thư mục home">⌂ Home</button>
                        <button class="sync-btn-ghost" id="sync-fs-reload" onclick="syncReload()" title="Tải lại">⟳</button>
                        <input class="sync-fs-path" id="sync-fs-path" value="${escapeHTML(syncSelectedPath || syncBrowsePath)}" placeholder="~ (home) — dán đường dẫn file/thư mục rồi Enter" onkeydown="if(event.key==='Enter'){event.preventDefault();syncBrowseTo(this.value.trim());}" title="Bấm chọn file bên dưới, hoặc dán đường dẫn file/thư mục rồi nhấn Enter">
                    </div>
                    <div class="sync-fs-list" id="sync-fs-list">
                        <div class="sync-fs-empty">Đang tải…</div>
                    </div>`;

                rightCol = `
                    <!-- CỘT PHẢI: chọn máy đích -->
                    <div class="sync-panel">
                        <div class="sync-panel-head">
                            <h3>3. Máy đích nhận file</h3>
                        </div>
                        <div class="sync-panel-body" style="padding-bottom: 8px;">
                            <label class="field-label">Đường dẫn đích (tự điền theo file nguồn, có thể sửa)</label>
                            <input class="modal-input sync-mono" id="sync-dest-path" value="${escapeHTML(syncSelectedPath)}" placeholder="Giống đường dẫn nguồn" oninput="syncDestPathEdited = true">
                            <div class="sync-note" style="margin-top: 6px;">File đã tồn tại ở đích sẽ bị <b>ghi đè</b>.</div>
                        </div>
                        <div class="sync-panel-body" style="padding-top: 6px;">
                            <input class="sync-search-input" id="sync-dest-search" placeholder="🔍 Tìm VPS đích (tên, IP, group)…" value="${escapeHTML(syncDestQuery)}" oninput="syncOnDestSearch(this.value)" style="margin-bottom: 8px;">
                            <div id="sync-dest-groups"></div>
                        </div>
                    </div>`;

                actions = `
                    <!-- KHU VỰC KIỂM TRA & ĐỒNG BỘ -->
                    <div class="sync-preflight" id="sync-preflight"></div>
                    <div class="sync-actions-bar">
                        <button class="sync-btn-primary" id="sync-btn-inspect" onclick="syncRunInspect()">Kiểm tra trước khi đồng bộ</button>
                        <button class="sync-btn-primary" id="sync-btn-start" onclick="syncConfirmStart()" disabled style="display:none;">Bắt đầu đồng bộ</button>
                        <button class="sync-btn-primary sync-btn-danger" id="sync-btn-cancel" onclick="syncCancelJob()" disabled style="display:none;">Hủy</button>
                        <span class="sync-note" id="sync-action-hint"></span>
                    </div>`;
            }

            area.innerHTML = `
                <div class="sync-layout" ${srcServer && syncStep === 2 ? '' : 'style="grid-template-columns: 1fr;"'}>
                    <div class="sync-panel">
                        <div class="sync-panel-head" style="display:flex;align-items:center;gap:10px;">
                            ${leftHead}
                        </div>
                        ${leftBody}
                    </div>
                    ${rightCol}
                </div>
                ${actions}
            `;

            if (syncStep === 1 || !srcServer) {
                syncRenderSourceGroups();
            } else {
                syncRenderDestGroups();
                syncLoadDir(syncBrowsePath);

                // Event delegation cho danh sách file: đọc data-path qua dataset
                // (đã được browser giải mã) nên an toàn với mọi ký tự trong tên file.
                const fsList = document.getElementById('sync-fs-list');
                if (fsList && !fsList.dataset.bound) {
                    fsList.dataset.bound = '1';
                    fsList.addEventListener('click', (ev) => {
                        const item = ev.target.closest('.sync-fs-item');
                        if (!item || !fsList.contains(item)) return;
                        const p = item.dataset.path;
                        if (p === undefined) return;
                        if (item.dataset.dir === '1') syncLoadDir(p);
                        else syncPickFile(p);
                    });
                }
            }
        }

        /* Quay lại bước 1 — giữ nguyên máy đã chọn để highlight */
        window.syncBackToSource = function() {
            syncStep = 1;
            syncResetActions();
            syncRenderStep();
        };

        /* ---- Cột trái: duyệt file ---- */
        /* Chọn file / cập nhật đường dẫn đã chọn + đồng bộ ô path và ô đích */
        function syncSetSelectedFile(fullPath) {
            syncSelectedPath = fullPath;
            syncInspectResult = null;
            syncResetActions();
            const pathBar = document.getElementById('sync-fs-path');
            if (pathBar) { pathBar.value = syncSelectedPath || syncBrowsePath; pathBar.title = syncSelectedPath || syncBrowsePath; }
            document.querySelectorAll('.sync-fs-item[data-path]').forEach(el => {
                el.classList.toggle('selected', el.dataset.path === syncSelectedPath);
            });
            // Tự điền đường dẫn đích theo file nguồn (nếu người dùng chưa sửa tay)
            if (!syncDestPathEdited) {
                const destInp = document.getElementById('sync-dest-path');
                if (destInp) destInp.value = syncSelectedPath;
            }
        }

        window.syncBrowseTo = function(path) {
            syncLoadDir(path);
        };

        window.syncReload = function() {
            syncLoadDir(syncBrowsePath);
        };

        window.syncBrowseUp = function() {
            if (!syncBrowsePath || syncBrowsePath === '/') return;
            const idx = syncBrowsePath.replace(/\/$/, '').lastIndexOf('/');
            const parent = idx <= 0 ? '/' : syncBrowsePath.slice(0, idx);
            syncLoadDir(parent);
        };

        async function syncLoadDir(path) {
            const listEl = document.getElementById('sync-fs-list');
            const upBtn = document.getElementById('sync-fs-up');
            if (!listEl) return;
            listEl.innerHTML = `<div class="sync-fs-empty">Đang tải…</div>`;
            if (upBtn) upBtn.disabled = true;

            try {
                const res = await fetch('/api/fs/list', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ server_id: syncSourceId, path: path || '' })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Không liệt kê được thư mục');

                syncBrowsePath = data.path || '';
                if (upBtn) upBtn.disabled = !(syncBrowsePath && syncBrowsePath !== '/');

                // Dán đường dẫn FILE vào ô path → tự chọn file đó, bảng dưới vẫn duyệt thư mục chứa nó
                if (data.is_file && data.file_path) {
                    syncSetSelectedFile(data.file_path);
                } else {
                    const pathBar = document.getElementById('sync-fs-path');
                    if (pathBar) { pathBar.value = syncBrowsePath; pathBar.title = syncBrowsePath; }
                }

                const entries = (data.entries || []).slice().sort((a, b) => {
                    if (a.is_dir !== b.is_dir) return a.is_dir ? -1 : 1;
                    return a.name.localeCompare(b.name);
                });

                if (!entries.length) {
                    listEl.innerHTML = `<div class="sync-fs-empty">Thư mục trống</div>`;
                    return;
                }

                listEl.innerHTML = entries.map(e => {
                    const full = (syncBrowsePath === '/' ? '' : syncBrowsePath) + '/' + e.name;
                    if (e.is_dir) {
                        // data-path là thuộc tính thuần — đọc lại qua dataset.path an toàn
                        // với mọi ký tự (kể cả nháy đơn), không như inline onclick.
                        return `<div class="sync-fs-item" data-path="${escapeHTML(full)}" data-dir="1">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--neon-cyan)" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                            <span class="fs-name dir">${escapeHTML(e.name)}</span>
                        </div>`;
                    }
                    const sel = full === syncSelectedPath ? ' selected' : '';
                    return `<div class="sync-fs-item${sel}" data-path="${escapeHTML(full)}" data-file="1">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="var(--text-muted)" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <span class="fs-name">${escapeHTML(e.name)}</span>
                        <span class="fs-size">${syncFormatBytes(e.size)}</span>
                    </div>`;
                }).join('');
            } catch (err) {
                listEl.innerHTML = `<div class="sync-fs-empty" style="color: var(--neon-red);">${escapeHTML(err.message)}</div>`;
            }
        }

        window.syncPickFile = function(fullPath) {
            // Bấm lại file đang chọn → bỏ chọn
            const deselected = syncSelectedPath === fullPath;
            syncSetSelectedFile(deselected ? '' : fullPath);
        };

        /* ---- Cột phải: chọn máy đích (group thu gọn mặc định) ---- */
        /* Lọc server theo từ khóa (tên, host, group) */
        function syncMatchQuery(s, q) {
            if (!q) return true;
            q = q.toLowerCase();
            return (s.label || '').toLowerCase().includes(q)
                || (s.host || '').toLowerCase().includes(q)
                || (s.group || 'Default').toLowerCase().includes(q);
        }

        /* Khung chọn máy nguồn — nhóm theo group, chọn 1 máy (không mặc định) */
        function syncRenderSourceGroups() {
            const wrap = document.getElementById('sync-source-groups');
            if (!wrap) return;
            const q = syncSourceQuery.trim();

            // Khi có từ khóa: hiện danh sách phẳng các máy khớp để dễ chọn nhanh
            if (q) {
                const matches = serverConfigs.filter(s => syncMatchQuery(s, q));
                if (!matches.length) {
                    wrap.innerHTML = `<div class="sync-fs-empty" style="padding:12px;">Không tìm thấy VPS khớp</div>`;
                    return;
                }
                wrap.innerHTML = `<div class="sync-targets-scroll" style="border:1px solid var(--border-crisp);border-radius:8px;">
                    ${matches.map(s => syncSourceItemHTML(s, true)).join('')}
                </div>`;
                return;
            }

            const grouped = syncGroupedServers();
            wrap.innerHTML = grouped.map(({ group, servers }) => {
                const open = syncSourceOpenGroups.has(group);
                return `<div class="sync-group-block">
                    <div class="sync-group-head clickable" onclick="syncToggleSourceGroupOpen('${escapeHTML(group)}')" title="Bấm để thu gọn / xổ danh sách máy">
                        <svg class="grp-caret ${open ? 'open' : ''}" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                        <span class="grp-name">${escapeHTML(group)}</span>
                        <span class="grp-count">${servers.length} máy</span>
                    </div>
                    <div class="sync-targets-scroll" ${open ? '' : 'hidden'}>
                        ${servers.map(s => syncSourceItemHTML(s, false)).join('')}
                    </div>
                </div>`;
            }).join('');
        }

        function syncSourceItemHTML(s, showGroup) {
            const online = syncIsOnline(s.id);
            const selected = s.id === syncSourceId;
            return `<div class="sync-target-item ${selected ? 'selected' : ''}" data-src-id="${escapeHTML(s.id)}" onclick="syncPickSource('${escapeHTML(s.id)}')" title="Chọn làm máy nguồn">
                <span class="node-dot ${online ? '' : 'offline'}" id="sync-src-dot-${escapeHTML(s.id)}"></span>
                <span class="tgt-label">${escapeHTML(s.label || s.id)}${showGroup && s.group ? ` <span style="color:var(--text-muted);font-size:0.75rem;">(${escapeHTML(s.group)})</span>` : ''}</span>
                <span class="tgt-host">${escapeHTML(s.host)}</span>
            </div>`;
        }

        window.syncToggleSourceGroupOpen = function(group) {
            if (syncSourceOpenGroups.has(group)) syncSourceOpenGroups.delete(group);
            else syncSourceOpenGroups.add(group);
            syncRenderSourceGroups();
        };

        window.syncPickSource = function(id) {
            const changed = syncSourceId !== id;
            syncSourceId = id;
            if (changed) {
                syncSelectedPath = '';
                syncBrowsePath = '';
                syncDestPathEdited = false;
                syncInspectResult = null;
            }
            // Sang bước 2: chọn file + máy đích
            syncStep = 2;
            syncResetActions();
            syncRenderStep();
        };

        window.syncOnSourceSearch = function(val) {
            syncSourceQuery = val;
            syncRenderSourceGroups();
        };

        window.syncOnDestSearch = function(val) {
            syncDestQuery = val;
            syncRenderDestGroups();
        };

        function syncRenderDestGroups() {
            const wrap = document.getElementById('sync-dest-groups');
            if (!wrap) return;
            const q = syncDestQuery.trim();
            const grouped = syncGroupedServers();

            wrap.innerHTML = grouped.map(({ group, servers }) => {
                let candidates = servers.filter(s => s.id !== syncSourceId);
                if (q) candidates = candidates.filter(s => syncMatchQuery(s, q));
                if (q && !candidates.length) return ''; // ẩn group không có máy khớp
                const checkedCount = candidates.filter(s => syncDestIds.has(s.id)).length;
                const allChecked = candidates.length > 0 && checkedCount === candidates.length;
                const open = q ? true : syncOpenGroups.has(group); // khi tìm kiếm: tự xổ group khớp
                return `<div class="sync-group-block">
                    <div class="sync-group-head ${candidates.length ? 'clickable' : ''}" onclick="syncToggleGroupOpen('${escapeHTML(group)}')" title="Bấm để thu gọn / xổ danh sách máy">
                        <svg class="grp-caret ${open ? 'open' : ''}" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
                        <span class="grp-name">${escapeHTML(group)}</span>
                        ${checkedCount ? `<span class="count-badge">${checkedCount}</span>` : ''}
                        <span class="grp-count">${candidates.length} máy</span>
                        <input type="checkbox" ${allChecked ? 'checked' : ''} onclick="event.stopPropagation()" onchange="syncToggleGroup('${escapeHTML(group)}', this.checked)" ${candidates.length ? '' : 'disabled'} title="Chọn / bỏ chọn cả cụm">
                    </div>
                    <div class="sync-targets-scroll" ${open ? '' : 'hidden'}>
                        ${candidates.length ? candidates.map(s => {
                            const online = syncIsOnline(s.id);
                            return `<label class="sync-target-item">
                                <input type="checkbox" ${syncDestIds.has(s.id) ? 'checked' : ''} onchange="syncToggleTarget('${escapeHTML(s.id)}', this.checked)">
                                <span class="node-dot ${online ? '' : 'offline'}" id="sync-dot-${escapeHTML(s.id)}"></span>
                                <span class="tgt-label">${escapeHTML(s.label || s.id)}</span>
                                <span class="tgt-host">${escapeHTML(s.host)}</span>
                            </label>`;
                        }).join('') : `<div class="sync-fs-empty" style="padding:12px;">Không có máy đích trong cụm này</div>`}
                    </div>
                </div>`;
            }).join('');
            if (q && !wrap.innerHTML.trim()) {
                wrap.innerHTML = `<div class="sync-fs-empty" style="padding:12px;">Không tìm thấy VPS khớp</div>`;
            }
        }

        window.syncToggleGroupOpen = function(group) {
            if (syncOpenGroups.has(group)) syncOpenGroups.delete(group);
            else syncOpenGroups.add(group);
            syncRenderDestGroups();
        };

        window.syncToggleTarget = function(id, checked) {
            if (checked) syncDestIds.add(id); else syncDestIds.delete(id);
            syncInspectResult = null;
            syncResetActions();
            syncRenderDestGroups();
        };

        window.syncToggleGroup = function(group, checked) {
            const q = syncDestQuery.trim();
            serverConfigs.forEach(s => {
                if ((s.group || 'Default') === group && s.id !== syncSourceId && syncMatchQuery(s, q)) {
                    if (checked) syncDestIds.add(s.id); else syncDestIds.delete(s.id);
                }
            });
            syncInspectResult = null;
            syncResetActions();
            syncRenderDestGroups();
        };

        /* Cập nhật dot online/offline tại chỗ mỗi tick WS — không render lại
           toàn bộ (tránh mất trạng thái checkbox). Trang sync render dot một
           lần lúc mở tab, khi đó metricsMap có thể chưa có dữ liệu. */
        function updateSyncStatusInPlace() {
            // Máy đích
            serverConfigs.forEach(s => {
                const dot = document.getElementById(`sync-dot-${s.id}`);
                if (dot) dot.className = `node-dot ${syncIsOnline(s.id) ? '' : 'offline'}`;
                // Máy nguồn (khung chọn theo group)
                const srcDot = document.getElementById(`sync-src-dot-${s.id}`);
                if (srcDot) srcDot.className = `node-dot ${syncIsOnline(s.id) ? '' : 'offline'}`;
            });
        }

        /* ---- Reset khu vực action khi lựa chọn thay đổi ---- */
        function syncResetActions() {
            const inspectBtn = document.getElementById('sync-btn-inspect');
            const startBtn = document.getElementById('sync-btn-start');
            const cancelBtn = document.getElementById('sync-btn-cancel');
            const hint = document.getElementById('sync-action-hint');
            if (inspectBtn) inspectBtn.style.display = '';
            if (startBtn) startBtn.style.display = 'none';
            if (cancelBtn) { cancelBtn.style.display = 'none'; cancelBtn.disabled = true; }
            if (hint) hint.textContent = '';
            const pre = document.getElementById('sync-preflight');
            if (pre) pre.innerHTML = '';
            if (syncPollTimer) { clearInterval(syncPollTimer); syncPollTimer = null; }
        }

        /* ---- Bước 2: kiểm tra trước khi đồng bộ ---- */
        window.syncRunInspect = async function() {
            if (!syncSourceId) { showToast('Chưa chọn máy nguồn'); return; }
            const srcPath = (syncSelectedPath || '').trim();
            if (!srcPath) { showToast('Chưa chọn file nguồn'); return; }
            if (syncDestIds.size === 0) { showToast('Chưa chọn máy đích nào'); return; }

            const destInput = (document.getElementById('sync-dest-path')?.value || '').trim();
            const destPath = destInput || srcPath; // để trống = dùng đường dẫn nguồn
            const inspectBtn = document.getElementById('sync-btn-inspect');
            if (inspectBtn) { inspectBtn.disabled = true; inspectBtn.textContent = 'Đang kiểm tra…'; }

            try {
                const res = await fetch('/api/sync/inspect', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        source_id: syncSourceId,
                        source_path: srcPath,
                        dest_path: destPath,
                        target_ids: Array.from(syncDestIds)
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'Kiểm tra thất bại');
                syncInspectResult = data;
                syncRenderPreflight(data);
            } catch (err) {
                showToast(err.message);
            } finally {
                if (inspectBtn) { inspectBtn.disabled = false; inspectBtn.textContent = 'Kiểm tra trước khi đồng bộ'; }
            }
        };

        function syncRenderPreflight(data) {
            const pre = document.getElementById('sync-preflight');
            if (!pre) return;
            const src = data.source || {};
            const info = src.info || {};

            // Đếm số máy đích hợp lệ (ok && !same) để cho phép bắt đầu
            const validTargets = (data.targets || []).filter(t => t.ok && !t.same);
            const startBtn = document.getElementById('sync-btn-start');
            const inspectBtn = document.getElementById('sync-btn-inspect');

            let srcRow;
            if (src.ok) {
                srcRow = `<tr>
                    <td><span class="sync-tag ok">File nguồn</span></td>
                    <td class="sync-mono">${escapeHTML(data.source_path)}</td>
                    <td class="sync-mono">${syncFormatBytes(info.size)}</td>
                    <td class="sync-mono">${escapeHTML((info.hash || '').slice(0, 12) || '—')}</td>
                    <td><span class="sync-tag ok">Sẵn sàng</span></td>
                </tr>`;
            } else {
                srcRow = `<tr>
                    <td><span class="sync-tag err">File nguồn</span></td>
                    <td class="sync-mono">${escapeHTML(data.source_path)}</td>
                    <td>—</td><td>—</td>
                    <td><span class="sync-tag err">${escapeHTML(src.error || 'Không đọc được')}</span></td>
                </tr>`;
            }

            const destRows = (data.targets || []).map(t => {
                const name = `${escapeHTML(t.label || t.id)} <span class="tgt-host">${escapeHTML(t.host || '')}</span>`;
                let tag, detail = '';
                if (!t.reachable) {
                    tag = `<span class="sync-tag err">Offline</span>`;
                    detail = `<span style="color:var(--neon-red);">${escapeHTML(t.error || 'Không kết nối được')}</span>`;
                } else if (!t.ok) {
                    tag = `<span class="sync-tag err">Lỗi</span>`;
                    detail = `<span style="color:var(--neon-red);">${escapeHTML(t.error || '')}</span>`;
                } else if (t.same) {
                    tag = `<span class="sync-tag muted">Giống nguồn</span>`;
                    detail = `Đã có file, md5 trùng — bỏ qua`;
                } else if (t.exists) {
                    tag = `<span class="sync-tag warn">Ghi đè</span>`;
                    detail = `Đang có ${syncFormatBytes(t.size)} · md5 ${escapeHTML((t.hash || '').slice(0, 8) || '—')}`;
                } else {
                    tag = `<span class="sync-tag ok">Mới</span>`;
                    detail = `Chưa có file — sẽ tạo mới`;
                }
                return `<tr>
                    <td>${name}</td>
                    <td class="sync-mono">${escapeHTML(t.dest_dir || data.dest_dir)}</td>
                    <td>${detail}</td>
                    <td>${tag}</td>
                </tr>`;
            }).join('');

            pre.innerHTML = `
                <div class="sync-panel">
                    <div class="sync-panel-head"><h3>3. Kết quả kiểm tra</h3></div>
                    <div class="sync-panel-body">
                        <label class="field-label">Máy nguồn</label>
                        <table class="sync-check-table">
                            <thead><tr><th></th><th>Đường dẫn</th><th>Kích thước</th><th>md5</th><th>Trạng thái</th></tr></thead>
                            <tbody>${srcRow}</tbody>
                        </table>
                        <label class="field-label" style="margin-top: 14px;">Máy đích (${(data.targets || []).length})</label>
                        <table class="sync-check-table">
                            <thead><tr><th>Máy</th><th>Thư mục đích</th><th>Tình trạng file</th><th>Hành động</th></tr></thead>
                            <tbody>${destRows || '<tr><td colspan="4" class="sync-fs-empty">Không có máy đích</td></tr>'}</tbody>
                        </table>
                    </div>
                </div>
            `;

            if (inspectBtn) inspectBtn.style.display = 'none';
            if (startBtn) {
                startBtn.style.display = '';
                startBtn.disabled = !(src.ok && validTargets.length > 0);
            }
            const hint = document.getElementById('sync-action-hint');
            if (hint) {
                if (!src.ok) hint.textContent = 'File nguồn không hợp lệ — không thể đồng bộ.';
                else if (validTargets.length === 0) hint.textContent = 'Không có máy đích nào cần đồng bộ (offline, lỗi, hoặc đã giống nguồn).';
                else hint.textContent = `Sẽ đồng bộ tới ${validTargets.length} máy.`;
            }
        }

        /* ---- Bước 3: bắt đầu đồng bộ + polling ---- */
        window.syncConfirmStart = function() {
            if (!syncInspectResult) return;
            const valid = (syncInspectResult.targets || []).filter(t => t.ok && !t.same);
            openConfirmModal('Xác nhận đồng bộ',
                `Đồng bộ "${syncInspectResult.source_path}" tới ${valid.length} máy đích? File trùng tên ở đích sẽ bị ghi đè.`,
                syncStartJob);
        };

        async function syncStartJob() {
            const data = syncInspectResult;
            if (!data) return;
            const validIds = (data.targets || []).filter(t => t.ok && !t.same).map(t => t.id);
            const destPath = (document.getElementById('sync-dest-path')?.value || '').trim() || data.source_path;

            const startBtn = document.getElementById('sync-btn-start');
            const cancelBtn = document.getElementById('sync-btn-cancel');
            if (startBtn) { startBtn.disabled = true; startBtn.textContent = 'Đang khởi động…'; }

            try {
                const res = await fetch('/api/sync/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        source_id: syncSourceId,
                        source_path: data.source_path,
                        dest_path: destPath,
                        target_ids: validIds
                    })
                });
                const out = await res.json();
                if (!res.ok) throw new Error(out.error || 'Không khởi động được');
                syncJobId = out.job_id;
                if (startBtn) startBtn.style.display = 'none';
                if (cancelBtn) { cancelBtn.style.display = ''; cancelBtn.disabled = false; }
                const hint = document.getElementById('sync-action-hint');
                if (hint) hint.textContent = 'Đang đồng bộ…';
                syncPollJob();
                syncPollTimer = setInterval(syncPollJob, 1000);
            } catch (err) {
                showToast(err.message);
                if (startBtn) { startBtn.disabled = false; startBtn.textContent = 'Bắt đầu đồng bộ'; }
            }
        }

        async function syncPollJob() {
            if (!syncJobId) return;
            try {
                const res = await fetch(`/api/sync/jobs/${syncJobId}?t=${Date.now()}`);
                const out = await res.json();
                if (!res.ok) throw new Error(out.error || 'Không đọc được trạng thái job');
                syncRenderJob(out.job);
                if (['done', 'failed', 'partial', 'cancelled'].includes(out.job.status)) {
                    if (syncPollTimer) { clearInterval(syncPollTimer); syncPollTimer = null; }
                    const cancelBtn = document.getElementById('sync-btn-cancel');
                    if (cancelBtn) cancelBtn.disabled = true;
                }
            } catch (err) {
                console.error('sync poll err', err);
            }
        }

        function syncRenderJob(job) {
            const pre = document.getElementById('sync-preflight');
            if (!pre || !job) return;
            const total = job.file_size || 0;

            const rows = (job.targets || []).map(t => {
                const pct = total > 0 ? Math.min(100, Math.round((t.progress || 0) / total * 100)) : 0;
                let tag;
                if (t.status === 'done') tag = `<span class="sync-tag ok">Xong</span>`;
                else if (t.status === 'failed') tag = `<span class="sync-tag err">Lỗi</span>`;
                else if (t.status === 'copying') tag = `<span class="sync-tag info">Đang copy</span>`;
                else tag = `<span class="sync-tag muted">Chờ</span>`;
                const errLine = t.error ? `<div style="color:var(--neon-red);font-size:.75rem;margin-top:3px;">${escapeHTML(t.error)}</div>` : '';
                return `<tr>
                    <td>${escapeHTML(t.label || t.id)} <span class="tgt-host">${escapeHTML(t.host || '')}</span></td>
                    <td>
                        <div class="sync-progress-track"><div class="sync-progress-fill ${t.status === 'done' ? 'done' : ''}" style="width:${pct}%"></div></div>
                        <span class="sync-mono" style="margin-left:8px;">${pct}%</span>
                        ${errLine}
                    </td>
                    <td>${tag}</td>
                </tr>`;
            }).join('');

            const done = (job.targets || []).filter(t => t.status === 'done').length;
            const cnt = (job.targets || []).length;
            let statusTag;
            if (job.status === 'done') statusTag = `<span class="sync-tag ok">Hoàn tất ${done}/${cnt}</span>`;
            else if (job.status === 'partial') statusTag = `<span class="sync-tag warn">Một phần ${done}/${cnt}</span>`;
            else if (job.status === 'failed') statusTag = `<span class="sync-tag err">Thất bại</span>`;
            else if (job.status === 'cancelled') statusTag = `<span class="sync-tag muted">Đã hủy</span>`;
            else statusTag = `<span class="sync-tag info">Đang chạy ${done}/${cnt}</span>`;

            pre.innerHTML = `
                <div class="sync-panel">
                    <div class="sync-panel-head"><h3>4. Tiến trình đồng bộ ${statusTag}</h3></div>
                    <div class="sync-panel-body">

        /* Vẽ chi tiết kết quả kiểm tra cập nhật vào section "Về ứng dụng" */
        function renderAboutUpdateResult(info) {
            const box = document.getElementById('about-update-result');
            if (!box || !info) return;

            if (info.error) {
                box.innerHTML = `<div class="update-banner err">⚠️ Không kiểm tra được: ${escapeHTML(info.error)}<br>Hãy chắc chắn máy chủ có Internet rồi thử lại.</div>`;
                return;
            }

            const hasRel = !!(info.release_url || info.release_name);
            const hasCommit = !!info.commit_sha;

            let html = '';
            if (info.has_update) {
                html += `<div class="update-banner new">
                    🔔 <b>Có bản mới!</b> Bản hiện tại <code>v${escapeHTML(info.current_version || '')}</code>${info.latest_version && info.latest_version !== info.current_version ? ` — bản phát hành mới nhất <code>v${escapeHTML(info.latest_version)}</code>` : ''}
                    ${info.checked_at ? `<div style="margin-top:6px;font-size:.76rem;opacity:.85;">Kiểm tra lúc: ${escapeHTML(formatDateTime(info.checked_at))}</div>` : ''}
                </div>`;
            } else {
                html += `<div class="update-banner ok">
                    ✅ Bạn đang dùng bản mới nhất (không có bản phát hành/commit nào mới hơn).
                    ${info.checked_at ? `<div style="margin-top:6px;font-size:.76rem;opacity:.85;">Kiểm tra lúc: ${escapeHTML(formatDateTime(info.checked_at))}</div>` : ''}
                </div>`;
            }

            if (hasRel) {
                html += `<div style="margin-top:16px;">
                    <div class="update-row">
                        <span class="lbl">Bản phát hành</span>
                        <span class="val">
                            ${escapeHTML(info.release_name || info.latest_version || '—')}
                            ${info.published_at ? `<span style="color:#94a3b8;font-size:.76rem;"> · ${escapeHTML(formatDateTime(info.published_at))}</span>` : ''}
                        </span>
                    </div>
                    ${info.release_url ? `<div class="update-row">
                        <span class="lbl"></span>
                        <span class="val"><a href="${escapeHTML(info.release_url)}" target="_blank" rel="noopener noreferrer" style="color:#7dd3fc;text-decoration:none;">→ Xem bản phát hành trên GitHub</a></span>
                    </div>` : ''}
                    ${info.release_body ? `<div class="update-release-body md">${renderMarkdown(info.release_body)}</div>` : ''}
                </div>`;
            }

            if (hasCommit) {
                html += `<div style="margin-top:16px;">
                    <div class="update-row"><span class="lbl">Commit mới nhất</span><span class="val">trên nhánh <code>main</code></span></div>

                        <div class="sha">${escapeHTML((info.commit_sha || '').slice(0, 10))}</div>
                        <div class="msg md">${renderMarkdown(info.commit_message || '(không có tiêu đề)')}</div>
                        <div class="date">${info.commit_date ? escapeHTML(formatDateTime(info.commit_date)) : ''}</div>
                        ${info.commit_url ? `<div style="margin-top:8px;"><a href="${escapeHTML(info.commit_url)}" target="_blank" rel="noopener noreferrer" style="color:#7dd3fc;text-decoration:none;font-size:.78rem;">→ Xem commit trên GitHub</a></div>` : ''}
                    </div>
                </div>`;
            }

            if (!hasRel && !hasCommit) {
                html += `<div style="margin-top:16px;font-size:.8rem;color:#94a3b8;">Không tìm thấy bản phát hành hay commit nào trên repo.</div>`;

            box.innerHTML = html;

        /* Render Markdown an toàn: escape HTML trước rồi mới parse
           (chỉ cho phép định dạng Markdown, không chạy HTML thô).
           Nếu CDN marked chưa tải được thì trả về text đã escape. */
        function renderMarkdown(text) {
            const escaped = escapeHTML(text || '');
            if (typeof marked === 'undefined' || !marked.parse) return escaped.replace(/\n/g, '<br>');
            try {
                return marked.parse(escaped, { breaks: true, gfm: true });
            } catch (e) {
                return escaped.replace(/\n/g, '<br>');
            }
        }

        /* Định dạng thời gian ISO → chuỗi dễ đọc (dd/mm/yyyy hh:mm) */
        function formatDateTime(iso) {
            if (!iso) return '';
            const d = new Date(iso);
            if (isNaN(d.getTime())) return iso;
            const p = (n) => String(n).padStart(2, '0');
            return `${p(d.getDate())}/${p(d.getMonth() + 1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
        }

        /* Bấm nút "Kiểm tra cập nhật" trong Cài đặt (bỏ cache phía server) */
        window.checkUpdateFromSettings = async function() {
            const btn = document.getElementById('btn-update-check');
            const txt = document.getElementById('btn-update-check-text');
            if (btn) { btn.disabled = true; btn.classList.add('spinning'); }
            if (txt) txt.textContent = 'Đang kiểm tra…';
            try {
                const info = await checkUpdate(true);
                renderAboutUpdateResult(info);
                updateAboutBadge();
                if (info && info.error) showToast('Không kiểm tra được cập nhật');
                else if (info && info.has_update) showToast('Có bản mới: v' + (info.latest_version || '?'));
                else showToast('Bạn đang dùng bản mới nhất');
            } catch (err) {
                const box = document.getElementById('about-update-result');
                if (box) box.innerHTML = `<div class="update-banner err">⚠️ ${escapeHTML(err.message)}</div>`;
            } finally {
                if (btn) { btn.disabled = false; btn.classList.remove('spinning'); }
                if (txt) txt.textContent = 'Kiểm tra cập nhật';
            }
        };

        };

        window.toggleProxyPassword = function() {
            const inp = document.getElementById('inp-prx-pass');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        };

        function collectProxyForm() {
            return {
                name: document.getElementById('inp-prx-name').value.trim(),
                type: document.getElementById('inp-prx-type').value,
                host: document.getElementById('inp-prx-host').value.trim(),
                port: parseInt(document.getElementById('inp-prx-port').value) || 0,
                username: document.getElementById('inp-prx-user').value.trim(),
                password: document.getElementById('inp-prx-pass').value
            };
        }

        function showProxyTestResult(ok, text) {
            const box = document.getElementById('prx-test-result');
            box.style.display = 'block';
            box.style.background = ok ? 'rgba(34,197,94,0.12)' : 'rgba(239,68,68,0.12)';
            box.style.border = `1px solid ${ok ? '#22c55e' : '#ef4444'}`;
            box.style.color = ok ? '#4ade80' : '#fca5a5';
            box.textContent = text;
        }

        function hideProxyTestResult() {
            document.getElementById('prx-test-result').style.display = 'none';
        }

        // Test proxy ngay trong modal (chưa cần lưu)
        window.testProxyFromModal = async function() {
            const btn = document.getElementById('btn-test-proxy');
            btn.disabled = true;
            btn.textContent = '⏳ Đang test...';
            hideProxyTestResult();
            try {
                const res = await fetch('/api/proxies/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(collectProxyForm())
                });
                if (!res.ok) {
                    let msg = 'HTTP ' + res.status;
                    try {
                        const err = await res.json();
                        if (err.error) msg = err.error;
                    } catch(_) {}
                    showProxyTestResult(false, '❌ ' + msg);
                    return;
                }
                const data = await res.json();
                if (data.ok) {
                    showProxyTestResult(true, `✅ Proxy hoạt động tốt (latency ${data.latency}ms)`);
                } else {
                    showProxyTestResult(false, '❌ Không kết nối được: ' + data.error);
                }
            } catch(e) {
                showProxyTestResult(false, '❌ Lỗi: ' + e.message);
            }
            btn.disabled = false;
            btn.textContent = '🔌 Test kết nối';
        };

        // Test proxy đã lưu — hiện kết quả ngay trên bảng
        window.testSavedProxy = async function(id) {
            const statusEl = document.getElementById('prx-status-' + id);
            const p = proxyList.find(x => x.id === id);
            if (!p || !statusEl) return;
            statusEl.textContent = '⏳ Đang test...';
            statusEl.style.color = '#94a3b8';
            try {
                const res = await fetch('/api/proxies/test', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(p)
                });
                if (!res.ok) {
                    statusEl.textContent = '❌ HTTP ' + res.status;
                    statusEl.style.color = '#fca5a5';
                    return;
                }
                const data = await res.json();
                if (data.ok) {
                    statusEl.textContent = `✅ OK (${data.latency}ms)`;
                    statusEl.style.color = '#4ade80';
                } else {
                    statusEl.textContent = '❌ ' + data.error;
                    statusEl.style.color = '#fca5a5';
                    statusEl.title = data.error;
                }
            } catch(e) {
                statusEl.textContent = '❌ Lỗi: ' + e.message;
                statusEl.style.color = '#fca5a5';
            }
        };

        window.handleProxySubmit = async function(e) {
            e.preventDefault();
            const payload = collectProxyForm();
            if (!payload.host) { showToast('Vui lòng nhập Host proxy'); return; }
            try {
                const url = editingProxyId ? `/api/proxies/${editingProxyId}` : '/api/proxies';
                const method = editingProxyId ? 'PUT' : 'POST';
                const res = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                if (!res.ok) {
                    let msg = 'Không thể lưu proxy (HTTP ' + res.status + ')';
                    try {
                        const err = await res.json();
                        if (err.error) msg = err.error;
                    } catch(_) {}
                    throw new Error(msg);
                }
                showToast(editingProxyId ? 'Đã cập nhật proxy' : `Đã thêm proxy "${payload.name || payload.host}"`);
                closeModalProxy();
                await fetchProxies();
                renderSettingsView(document.getElementById('workbench-content-area'));
            } catch(err) {
                showToast(err.message);
            }
        };

        window.deleteProxy = async function(id, name, usage) {
            let msg = `Xác nhận xóa proxy "${name}"?`;
            if (usage > 0) msg += `\n${usage} server đang dùng proxy này sẽ chuyển về kết nối trực tiếp.`;
            if (!confirm(msg)) return;
            try {
                const res = await fetch(`/api/proxies/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Lỗi xóa proxy');
                showToast(`Đã xóa proxy "${name}"`);
                await fetchProxies();
                await refreshServerConfigs();
            } catch(err) {
                showToast(err.message);
            }
        };

        /* ============================================================
           MODAL HANDLERS
           ============================================================ */
        window.openAddGroupModal = function() {
            document.getElementById('inp-grp-name').value = '';
            document.getElementById('modal-group').classList.add('active');
        };
        window.closeModalGroup = function() {
            document.getElementById('modal-group').classList.remove('active');
        };

        window.handleGroupSubmit = async function(e) {
            e.preventDefault();
            const name = document.getElementById('inp-grp-name').value.trim();
            if (!name) return;
            try {
                const res = await fetch('/api/groups', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });
                if (!res.ok) {
                    const errData = await res.json();
                    throw new Error(errData.error || 'Lỗi tạo group');
                }
                showToast(`Đã tạo group "${name}"`);
                closeModalGroup();
                await fetchGroups();
                await refreshServerConfigs();
            } catch (err) {
                showToast(err.message);
            }
        };

        window.openEditGroupModal = function(oldName) {
            document.getElementById('inp-old-grp').value = oldName;
            document.getElementById('inp-new-grp').value = oldName;
            document.getElementById('modal-edit-group').classList.add('active');
        };
        window.closeModalEditGroup = function() {
            document.getElementById('modal-edit-group').classList.remove('active');
        };

        window.handleEditGroupSubmit = async function(e) {
            e.preventDefault();
            const oldName = document.getElementById('inp-old-grp').value;
            const newName = document.getElementById('inp-new-grp').value.trim();
            if (!newName || newName === oldName) {
                closeModalEditGroup();
                return;
            }
            try {
                const res = await fetch(`/api/groups/${encodeURIComponent(oldName)}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ new_name: newName })
                });
                if (!res.ok) throw new Error('Không thể đổi tên group');
                showToast(`Đã đổi tên group thành "${newName}"`);
                closeModalEditGroup();
                await fetchGroups();
                await refreshServerConfigs();
            } catch (err) {
                showToast(err.message);
            }
        };

        window.deleteGroup = async function(name, count) {
            let msg = `Xác nhận xóa group "${name}"?`;
            if (count > 0) msg += `\n${count} máy chủ thuộc group này sẽ chuyển về "Default".`;
            if (!confirm(msg)) return;
            try {
                const res = await fetch(`/api/groups/${encodeURIComponent(name)}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Lỗi xóa group');
                showToast(`Đã xóa group "${name}"`);
                await fetchGroups();
                await refreshServerConfigs();
            } catch (err) {
                showToast(err.message);
            }
        };

        window.openAddServerModal = function(id = null) {
            editingServerId = id;
            updateClusterSelectors();
            updateProxySelector();
            const title = document.getElementById('modal-server-title');
            const saveBtn = document.getElementById('btn-save-server');

            if (editingServerId) {
                title.textContent = 'Sửa Cấu Hình Server';
                saveBtn.textContent = 'Lưu Thay Đổi';
                const s = serverConfigs.find(x => x.id === editingServerId);
                if (s) {
                    document.getElementById('inp-srv-label').value = s.label || '';
                    document.getElementById('inp-srv-group').value = s.group || (systemGroups[0] || '');
                    document.getElementById('inp-srv-host').value = s.host || '';
                    document.getElementById('inp-srv-port').value = s.port || 22;
                    document.getElementById('inp-srv-user').value = s.user || 'root';
                    document.getElementById('inp-srv-pass').value = s.password || '';
                    document.getElementById('inp-srv-key').value = s.key_path || '';
                    document.getElementById('inp-srv-proxy').value = s.proxy_id || '';
                }
            } else {
                title.textContent = 'Thêm Server Mới';
                saveBtn.textContent = 'Thêm Server';
                document.getElementById('inp-srv-label').value = '';
                document.getElementById('inp-srv-host').value = '';
                document.getElementById('inp-srv-port').value = 22;
                document.getElementById('inp-srv-user').value = 'root';
                document.getElementById('inp-srv-pass').value = '';
                document.getElementById('inp-srv-key').value = '';
                document.getElementById('inp-srv-proxy').value = '';
                // Tự chọn group đang đứng (thanh lọc group hoặc dropdown cụm)
                const activeGroup = (currentGroupFilter !== 'all' && systemGroups.includes(currentGroupFilter))
                    ? currentGroupFilter
                    : (selectedCluster !== 'all' && systemGroups.includes(selectedCluster) ? selectedCluster : 'Default');
                document.getElementById('inp-srv-group').value = activeGroup;
            }
            setPasswordVisible(false);
            document.getElementById('modal-server').classList.add('active');
        };

        // Đổ danh sách proxy vào dropdown của modal server
        function updateProxySelector() {
            const sel = document.getElementById('inp-srv-proxy');
            if (!sel) return;
            const cur = sel.value;
            let opts = '<option value="">Trực tiếp (không qua proxy)</option>';
            proxyList.forEach(p => {
                opts += `<option value="${escapeHTML(p.id)}">${escapeHTML(p.name)} (${escapeHTML(p.type)}://${escapeHTML(p.host)}:${p.port})</option>`;
            });
            sel.innerHTML = opts;
            sel.value = cur;
        }

        // Hiện/ẩn mật khẩu trong modal server (tool local, không lo bảo mật)
        function setPasswordVisible(visible) {
            const inp = document.getElementById('inp-srv-pass');
            const iconEye = document.getElementById('icon-eye');
            const iconEyeOff = document.getElementById('icon-eye-off');
            if (inp) inp.type = visible ? 'text' : 'password';
            if (iconEye) iconEye.style.display = visible ? 'none' : '';
            if (iconEyeOff) iconEyeOff.style.display = visible ? '' : 'none';
        }

        window.togglePasswordVisibility = function() {
            const inp = document.getElementById('inp-srv-pass');
            if (!inp) return;
            setPasswordVisible(inp.type === 'password');
        };

        window.closeModalServer = function() {
            document.getElementById('modal-server').classList.remove('active');
            editingServerId = null;
        };

        window.handleServerSubmit = async function(e) {
            e.preventDefault();
            const payload = {
                label: document.getElementById('inp-srv-label').value.trim(),
                group: document.getElementById('inp-srv-group').value,
                host: document.getElementById('inp-srv-host').value.trim(),
                port: parseInt(document.getElementById('inp-srv-port').value) || 22,
                user: document.getElementById('inp-srv-user').value.trim() || 'root',
                password: document.getElementById('inp-srv-pass').value,
                key_path: document.getElementById('inp-srv-key').value.trim(),
                proxy_id: document.getElementById('inp-srv-proxy').value
            };

            if (!payload.host) {
                showToast('Vui lòng nhập Host / IP');
                return;
            }
            if (!payload.group) {
                showToast('Vui lòng chọn Cụm');
                return;
            }
            // Label để trống → backend tự điền bằng Host
            const displayLabel = payload.label || payload.host;

            try {
                if (editingServerId) {
                    const res = await fetch(`/api/servers/${editingServerId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error('Không thể cập nhật server');
                    const updated = await res.json();
                    const finalLabel = updated.label || displayLabel;
                    showToast(`Đã cập nhật server "${finalLabel}"`);
                    const found = serverConfigs.find(x => x.id === editingServerId);
                    if (found) {
                        found.label = finalLabel;
                        found.group = payload.group;
                        found.host = payload.host;
                        found.port = payload.port;
                        found.user = payload.user;
                        found.key_path = payload.key_path;
                        found.proxy_id = payload.proxy_id;
                    }
                } else {
                    const res = await fetch('/api/servers', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    if (!res.ok) throw new Error('Không thể thêm server mới');
                    const newSrv = await res.json();
                    showToast(`Đã thêm server "${newSrv.label || displayLabel}"`);
                    serverConfigs.push(newSrv);
                }
                closeModalServer();
                renderViewContent();
                refreshServerConfigs();
            } catch (err) {
                showToast(err.message);
            }
        };

        window.editServer = function(id) {
            openAddServerModal(id);
        };

        // Custom Confirm Modal Logic
        let confirmCallback = null;
        window.openConfirmModal = function(title, message, callback) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').innerHTML = message;
            confirmCallback = callback;
            document.getElementById('modal-confirm').classList.add('active');
        };
        window.closeConfirmModal = function() {
            document.getElementById('modal-confirm').classList.remove('active');
            confirmCallback = null;
        };
        document.getElementById('btn-confirm-ok').addEventListener('click', () => {
            if (confirmCallback) confirmCallback();
            closeConfirmModal();
        });

        window.deleteServer = function(id, host) {
            openConfirmModal('Xóa Server', `Xác nhận xóa server <strong>${escapeHTML(host)}</strong>?<br><span style="color:#94a3b8;font-size:0.85rem;">Hành động này không thể hoàn tác.</span>`, async () => {
                try {
                    const res = await fetch(`/api/servers/${id}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('Không thể xóa server');
                    showToast(`Đã xóa server "${host}"`);
                    serverConfigs = serverConfigs.filter(x => x.id !== id);
                    renderViewContent();
                    refreshServerConfigs();
                } catch (err) {
                    showToast(err.message);
                }
            });
        };

        window.deleteGroup = function(groupName, count) {
            if (count > 0) {
                showToast('Group này đang chứa server, không thể xóa!');
                return;
            }
            openConfirmModal('Xóa Group', `Xác nhận xóa group "${groupName}"?`, async () => {
                try {
                    const res = await fetch(`/api/groups/${groupName}`, { method: 'DELETE' });
                    if (!res.ok) throw new Error('Không thể xóa group');
                    showToast(`Đã xóa group "${groupName}"`);
                    systemGroups = systemGroups.filter(g => g !== groupName);
                    if (selectedCluster === groupName) {
                        selectedCluster = 'all';
                        localStorage.setItem('wb_selected_cluster', 'all');
                    }
                    updateClusterSelectors();
                    renderViewContent();
                    document.getElementById('sb-count-groups').textContent = systemGroups.length;
                } catch (err) {
                    showToast(err.message);
                }
            });
        };

        document.addEventListener('keydown', (e) => {
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                e.preventDefault();
                const search = document.getElementById('top-search-input');
                if (search && search.offsetParent !== null) search.focus();
            }
            if (e.key === 'Escape') {
                document.querySelectorAll('.modal-overlay').forEach(m => m.classList.remove('active'));
            }
        });

        /* Startup — Nạp dữ liệu cấu hình song song trước */
        document.getElementById('top-interval-select').value = String(refreshIntervalMs);
        const startupLabelEl = document.getElementById('wb-live-label');
        if (startupLabelEl) startupLabelEl.textContent = 'Live ' + (refreshIntervalMs / 1000) + 's';
        
        Promise.all([fetchGroups(), fetchProxies(), refreshServerConfigs()]).then(() => {
            connectWebSocket();
            switchViewTab(currentView, true);
        });

        // Nạp phiên bản + kiểm tra cập nhật (chạy nền, không chặn UI)
        initVersionInfo();

    })();
    </script>
</body>
</html>
