<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSH Monitor — High-Performance VPS Monitor</title>
    <meta name="description" content="Crisp, high-contrast, agentless VPS monitoring & cluster management inspired by SSH Workbench">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           SSH Workbench Theme — High Contrast, Crisp Dark Slate
           (Tuyệt đối không bị mờ, chữ trắng sáng 100%, nét như in)
           ============================================================ */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Tailwind / Shadcn Slate Palette (Exact Sampled Colors from SSH Workbench) */
            --bg-body: #020817;
            --bg-sidebar: #020817;
            --bg-navbar: #020817;
            --bg-surface: #020817;
            --bg-card: #020817;
            --bg-card-hover: #0f172a;
            --bg-table-header: #1e293b;
            --bg-track: #1e293b;
            --bg-pill: #0f172a;
            --bg-pill-hover: #1e293b;

            /* Crisp Slate 800 Borders */
            --border-crisp: #1e293b;
            --border-muted: #1e293b;
            --border-hover: #334155;
            --border-active: #3b82f6;

            /* High Contrast Typography */
            --text-white: #ffffff;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --text-dark: #475569;

            /* Vivid Accent Colors */
            --neon-green: #22c55e;
            --neon-green-glow: rgba(34, 197, 94, 0.4);
            --neon-emerald: #22c55e;
            --neon-cyan: #06b6d4;
            --neon-amber: #eab308;
            --neon-red: #ef4444;
            --neon-violet: #a855f7;
            --neon-blue: #3b82f6;

            /* Fonts */
            --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-mono: 'JetBrains Mono', 'SF Mono', 'Cascadia Code', monospace;
        }

        html {
            font-size: 15px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            text-rendering: optimizeLegibility;
        }

        body {
            font-family: var(--font-ui);
            background-color: var(--bg-body);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.45;
            overflow-x: hidden;
        }

        .workbench-layout {
            display: flex;
            min-height: 100vh;
        }

        /* ============================================================
           SIDEBAR (Menu trái phong cách Workbench)
           ============================================================ */
        .workbench-sidebar {
            width: 230px;
            min-width: 230px;
            background-color: var(--bg-sidebar);
            border-right: 1px solid var(--border-crisp);
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            user-select: none;
            z-index: 90;
        }

        .sidebar-brand {
            padding: 16px 18px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid var(--border-crisp);
        }

        .brand-logo-icon {
            width: 28px;
            height: 28px;
            border-radius: 6px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .brand-logo-icon svg { width: 16px; height: 16px; }

        .brand-text {
            font-size: 0.88rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            color: var(--text-white);
            text-transform: uppercase;
        }

        .sidebar-nav-list {
            padding: 14px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            overflow-y: auto;
        }

        .sidebar-section-heading {
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.09em;
            color: var(--text-dark);
            padding: 8px 10px 4px;
        }

        .nav-link-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            border-radius: 6px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 120ms ease, color 120ms ease;
            border: 1px solid transparent;
        }

        .nav-link-left {
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .nav-link-btn svg {
            width: 17px;
            height: 17px;
            color: var(--text-muted);
        }

        .nav-link-btn:hover {
            background-color: var(--bg-card-hover);
            color: var(--text-white);
        }

        .nav-link-btn:hover svg { color: var(--text-white); }

        .nav-link-btn.active {
            background-color: #141c2c;
            color: var(--text-white);
            border-color: #1e293f;
            font-weight: 600;
        }

        .nav-link-btn.active svg { color: var(--neon-cyan); }

        .count-badge {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            padding: 1px 6px;
            border-radius: 4px;
            background-color: var(--bg-track);
            color: var(--text-secondary);
        }

        .nav-link-btn.active .count-badge {
            background-color: rgba(6, 182, 212, 0.2);
            color: var(--neon-cyan);
        }

        /* Sidebar Footer */
        .sidebar-footer-box {
            padding: 14px;
            border-top: 1px solid var(--border-crisp);
            background-color: #080c13;
        }

        .live-status-pill {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            background-color: var(--bg-card);
            border: 1px solid var(--border-crisp);
            font-size: 0.78rem;
        }

        .live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: var(--neon-green);
            box-shadow: 0 0 8px var(--neon-green-glow);
            animation: liveGlow 2s infinite ease-in-out;
        }

        @keyframes liveGlow {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.15); opacity: 0.7; }
        }

        .live-dot.offline { background-color: var(--neon-red); box-shadow: none; animation: none; }

        /* ============================================================
           MAIN WORKBENCH AREA
           ============================================================ */
        .workbench-main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            background-color: var(--bg-body);
        }

        /* TOPBAR */
        .workbench-topbar {
            position: sticky;
            top: 0;
            z-index: 80;
            background-color: var(--bg-navbar);
            border-bottom: 1px solid var(--border-crisp);
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
        }

        .topbar-left-controls {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .view-title-tag {
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.01em;
            margin-right: 6px;
        }

        .select-cluster-dropdown, .select-interval-dropdown {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: var(--bg-pill);
            border: 1px solid var(--border-crisp);
            color: var(--text-white);
            font-family: var(--font-ui);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            transition: border-color 120ms ease, background 120ms ease;
        }

        .select-cluster-dropdown:hover, .select-interval-dropdown:hover {
            border-color: var(--border-hover);
            background-color: var(--bg-pill-hover);
        }

        .select-interval-dropdown {
            font-family: var(--font-mono);
            color: var(--neon-green);
        }

        .topbar-search {
            position: relative;
            width: 240px;
        }

        .topbar-search input {
            width: 100%;
            padding: 6px 10px 6px 30px;
            border-radius: 6px;
            background-color: var(--bg-pill);
            border: 1px solid var(--border-crisp);
            color: var(--text-white);
            font-size: 0.8rem;
            outline: none;
            transition: border-color 120ms ease;
        }

        .topbar-search input:focus {
            border-color: var(--neon-cyan);
            background-color: var(--bg-card);
        }

        .topbar-search svg {
            position: absolute;
            left: 9px;
            top: 50%;
            transform: translateY(-50%);
            width: 14px;
            height: 14px;
            color: var(--text-muted);
            pointer-events: none;
        }

        /* Action Buttons */
        .topbar-right-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Phiên bản + thông báo cập nhật + liên hệ (góc phải topbar) */
        .app-version-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 10px;
            border-radius: 6px;
            background-color: var(--bg-pill);
            border: 1px solid var(--border-crisp);
            color: var(--text-secondary);
            font-family: var(--font-mono);
            font-size: 0.75rem;
            font-weight: 700;
            white-space: nowrap;
            cursor: default;
        }
        .app-version-chip.has-update {
            color: #fbbf24;
            border-color: rgba(251, 191, 36, 0.5);
            background-color: rgba(251, 191, 36, 0.1);
            cursor: pointer;
        }
        .app-version-chip.has-update:hover {
            background-color: rgba(251, 191, 36, 0.18);
        }

        .btn-telegram {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 6px;
            background-color: rgba(34, 158, 217, 0.12);
            border: 1px solid rgba(34, 158, 217, 0.45);
            color: #4fc3f7;
            font-family: var(--font-ui);
            font-size: 0.78rem;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            white-space: nowrap;
            transition: all 120ms ease;
        }
        .btn-telegram:hover {
            background-color: rgba(34, 158, 217, 0.22);
            color: #7dd3fc;
        }
        .btn-telegram svg { width: 14px; height: 14px; flex-shrink: 0; }

        /* Nhịp thông báo bản mới */
        @keyframes updatePulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.5); }
            50% { box-shadow: 0 0 0 4px rgba(251, 191, 36, 0); }
        }
        .app-version-chip.has-update {
            animation: updatePulse 2s ease-in-out infinite;
        }

        /* Khối "Về ứng dụng / Cập nhật" trong Cài đặt */
        .update-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }
        .update-row {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            font-size: 0.84rem;
            line-height: 1.6;
        }
        .update-row .lbl {
            color: #94a3b8;
            min-width: 130px;
            flex-shrink: 0;
        }
        .update-row .val {
            color: #e2e8f0;
            word-break: break-word;
        }
        .update-banner {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 0.84rem;
            line-height: 1.55;
            border: 1px solid;
        }
        .update-banner.ok {
            background-color: rgba(34, 197, 94, 0.1);
            border-color: rgba(34, 197, 94, 0.4);
            color: #86efac;
        }
        .update-banner.new {
            background-color: rgba(251, 191, 36, 0.1);
            border-color: rgba(251, 191, 36, 0.45);
            color: #fcd34d;
        }
        .update-banner.err {
            background-color: rgba(248, 113, 113, 0.1);
            border-color: rgba(248, 113, 113, 0.4);
            color: #fca5a5;
        }
        .update-banner code {
            font-family: var(--font-mono);
            font-size: 0.78rem;
            background-color: rgba(148, 163, 184, 0.15);
            padding: 1px 6px;
            border-radius: 4px;
        }
        .update-commit-box {
            background-color: rgba(148, 163, 184, 0.07);
            border: 1px solid var(--border-crisp);
            border-radius: 8px;
            padding: 12px 14px;
            font-size: 0.82rem;
        }
        .update-commit-box .sha {
            font-family: var(--font-mono);
            font-size: 0.76rem;
            color: #7dd3fc;
        }
        .update-commit-box .msg {
            color: #e2e8f0;
            margin: 6px 0;
            line-height: 1.5;
        }
        .update-commit-box .date {
            font-size: 0.76rem;
            color: #94a3b8;
        }
        .update-release-body {
            max-height: 260px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 0.79rem;
            color: #cbd5e1;
            background-color: rgba(148, 163, 184, 0.07);
            border: 1px solid var(--border-crisp);
            border-radius: 8px;
            padding: 12px 14px;
            line-height: 1.6;
        }
        /* Markdown đã render: bỏ pre-wrap, định dạng lại các thẻ */
        .update-release-body.md,
        .update-commit-box .msg.md {
            white-space: normal;
        }
        .md h1, .md h2, .md h3 {
            color: #e2e8f0;
            margin: 10px 0 6px;
            font-size: 0.88rem;
        }
        .md h1:first-child, .md h2:first-child, .md h3:first-child { margin-top: 0; }
        .md p { margin: 4px 0; }
        .md ul, .md ol { margin: 4px 0; padding-left: 20px; }
        .md li { margin: 2px 0; }
        .md a { color: #7dd3fc; text-decoration: none; }
        .md a:hover { text-decoration: underline; }
        .md code {
            font-family: var(--font-mono);
            font-size: 0.76rem;
            background-color: rgba(148, 163, 184, 0.15);
            padding: 1px 5px;
            border-radius: 4px;
        }
        .md pre {
            background-color: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-crisp);
            border-radius: 6px;
            padding: 8px 10px;
            overflow-x: auto;
            margin: 6px 0;
        }
        .md pre code { background: none; padding: 0; }
        .md blockquote {
            border-left: 2px solid var(--border-hover);
            margin: 6px 0;
            padding: 2px 10px;
            color: #94a3b8;
        }
        .md hr { border: none; border-top: 1px solid var(--border-crisp); margin: 8px 0; }

        .btn-update-check {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border-radius: 6px;
            background-color: var(--bg-pill);
            border: 1px solid var(--border-crisp);
            color: var(--text-secondary);
            font-family: var(--font-ui);
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 120ms ease;
        }
        .btn-update-check:hover:not(:disabled) {
            background-color: var(--bg-pill-hover);
            color: var(--text-white);
            border-color: var(--border-hover);
        }
        .btn-update-check:disabled { opacity: 0.5; cursor: not-allowed; }
        .btn-update-check svg { width: 14px; height: 14px; }
        .btn-update-check.spinning svg { animation: spinRefresh 900ms linear infinite; }
        @keyframes spinRefresh { to { transform: rotate(360deg); } }

        .btn-icon-refresh {
            width: 32px;
            height: 32px;
            border-radius: 6px;
            background-color: var(--bg-pill);
            border: 1px solid var(--border-crisp);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 120ms ease;
        }

        .btn-icon-refresh:hover {
            background-color: var(--bg-pill-hover);
            color: var(--text-white);
            border-color: var(--border-hover);
        }

        .btn-icon-refresh svg { width: 15px; height: 15px; }

        .btn-create-group {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 6px;
            background-color: #ef4444;
            border: 1px solid #ef4444;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 120ms ease;
        }

        .btn-create-group:hover {
            background-color: #dc2626;
            border-color: #dc2626;
        }

        .btn-create-server {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 6px;
            background-color: #ef4444;
            border: 1px solid #ef4444;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 120ms ease;
        }

        .btn-create-server:hover {
            background-color: #dc2626;
            border-color: #dc2626;
        }

        /* ============================================================
           DATA TABLE (Thiết kế chuẩn SSH Workbench)
           ============================================================ */
        .workbench-content {
            padding: 20px 24px;
            flex: 1;
        }

        /* Trang SETTINGS: sidebar trái + nội dung phải */
        .settings-layout {
            display: flex;
            gap: 24px;
            align-items: flex-start;
        }

        .settings-sidebar {
            width: 220px;
            flex-shrink: 0;
            background-color: #020817;
            border: 1px solid #1e293b;
            border-radius: 8px;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .settings-nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--text-secondary);
            font-family: var(--font-ui);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            text-align: left;
            transition: background 120ms ease, color 120ms ease;
        }

        .settings-nav-item svg {
            width: 17px;
            height: 17px;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .settings-nav-item:hover {
            background-color: var(--bg-card-hover);
            color: var(--text-white);
        }

        .settings-nav-item.active {
            background-color: #141c2c;
            border-color: #1e293f;
            color: var(--text-white);
            font-weight: 600;
        }

        .settings-nav-item.active svg { color: var(--neon-cyan); }

        .settings-content {
            flex: 1;
            min-width: 0;
        }

        .settings-content > [hidden] { display: none !important; }

        .table-title-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 14px;
        }

        .table-title-bar h3 {
            font-size: 1.22rem;
            font-weight: 700;
            color: var(--text-white);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Group Filter Bar */
        .group-filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 6px;
            padding-top: 2px;
        }
        .group-filter-bar::-webkit-scrollbar {
            height: 4px;
        }
        .group-filter-bar::-webkit-scrollbar-thumb {
            background-color: #334155;
            border-radius: 4px;
        }
        .group-filter-btn {
            background-color: #0f172a;
            color: #94a3b8;
            border: 1px solid #1e293b;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
            user-select: none;
        }
        .group-filter-btn:hover {
            color: #fff;
            border-color: #334155;
            background-color: #1e293b;
        }
        .group-filter-btn.active {
            background-color: #ef4444;
            color: #fff;
            border-color: #ef4444;
        }

        .table-container {
            width: 100%;
            background-color: #020817;
            border: 1px solid #1e293b;
            border-radius: 8px;
            overflow: visible;
        }

        .wb-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            background-color: #020817;
        }

        .wb-table th {
            background-color: #1e293b;
            padding: 12px 20px;
            font-size: 0.88rem;
            font-weight: 600;
            text-transform: none;
            letter-spacing: normal;
            color: #94a3b8;
            border-bottom: 1px solid #1e293b;
            user-select: none;
        }

        .wb-table th:first-child { border-top-left-radius: 8px; }
        .wb-table th:last-child { border-top-right-radius: 8px; }

        .wb-table td {
            background-color: #020817;
            padding: 16px 20px;
            border-bottom: 1px solid #1e293b;
            vertical-align: middle;
            transition: background 100ms ease;
        }

        .wb-table tr:hover td {
            background-color: #0f172a;
        }

        /* Bảng Quản lý Server: giảm padding ngang để các cột sát nhau hơn,
           dành chỗ cho cột CPU in đủ 1 dòng không xuống dòng */
        #manage-servers-table th,
        #manage-servers-table td {
            padding-left: 10px;
            padding-right: 10px;
        }
        #manage-servers-table td .cpu-nowrap {
            white-space: nowrap;
        }

        /* ============================================================
           VIEW: ĐỒNG BỘ FILE (2 cột — duyệt file nguồn / chọn máy đích)
           ============================================================ */
        .sync-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            align-items: start;
        }
        .sync-panel {
            background-color: var(--bg-card);
            border: 1px solid var(--border-crisp);
            border-radius: 10px;
            overflow: hidden;
        }
        .sync-panel-head {

        .system-cell {
            display: flex;
            align-items: center;
            gap: 10px;
        }

            width: 9px;
            height: 9px;
            border-radius: 50%;

            flex-shrink: 0;
        }

        .node-dot.offline {
            background-color: var(--neon-red);
            box-shadow: none;
        }

        .system-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .system-ip {
            font-family: var(--font-mono);
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text-white);
            letter-spacing: -0.01em;

        .system-meta {
            font-family: var(--font-mono);
            font-size: 0.84rem;
            color: #94a3b8;
            margin-top: 2px;
        }

        .group-tag-inline {
            display: inline-block;
            padding: 2px 7px;
            border-radius: 4px;
            background-color: #172033;
            color: #93c5fd;
            font-size: 0.72rem;
            font-family: var(--font-ui);
            font-weight: 600;
            margin-left: 8px;
        }

        /* Cột METRICS: CPU, Memory, Disk */
        .metric-cell {
            min-width: 145px;
        }

        .metric-values {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 6px;
            white-space: nowrap;
        }

        .metric-pct {
            font-family: var(--font-mono);
            font-size: 1.02rem;
            font-weight: 700;
            color: var(--text-white);
        }

        .metric-subtext {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            font-weight: 500;
            color: #94a3b8;
            white-space: nowrap;
        }

        .metric-track {
            width: 100%;
            height: 6px;
            background-color: #1e293b;
            border-radius: 9999px;
            overflow: hidden;
        }

        .metric-fill {
            height: 100%;
            border-radius: 9999px;
            transition: width 0.4s ease;
        }

        .metric-fill.cpu { background-color: #22c55e; }
        .metric-fill.mem { background-color: #22c55e; }
        .metric-fill.disk { background-color: #eab308; }
        .metric-fill.disk-safe { background-color: #22c55e; }
        .metric-fill.danger { background-color: #ef4444 !important; }

        /* Cột NETWORK */
        .network-cell {
            font-family: var(--font-mono);
            font-size: 0.86rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 135px;

        .net-line {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .net-line.rx { color: var(--text-white); font-weight: 600; }

        .net-line.tx { color: #94a3b8; font-weight: 500; }
        .net-line.tx svg { color: #94a3b8; }

        /* Cột UPTIME */
        .uptime-cell {
            font-family: var(--font-mono);
            font-size: 0.94rem;
            font-weight: 500;
            color: var(--text-white);

        /* ============================================================

        .drag-cell {

            padding-right: 8px !important;

        .drag-handle-btn {

        .draggable-row.dragging {

        }

        .draggable-row.drag-over {
            border-top: 2px solid var(--neon-cyan) !important;
        }

           ============================================================ */
        .modal-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background-color: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-head h3 { font-size: 0.95rem; font-weight: 700; color: #fff; }
        .modal-close { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 1.2rem; }

        .modal-body {
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .field-label { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; display: block; }

        .modal-input {
            width: 100%;
            padding: 7px 10px;
            border-radius: 6px;
            background-color: #080c14;
            border: 1px solid #1c2538;
            color: #fff;
            font-size: 0.82rem;
            outline: none;
        }

        .modal-input:focus { border-color: var(--neon-cyan); }

        .modal-foot {
            padding: 12px 20px;
            border-top: 1px solid var(--border-crisp);
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            background-color: #0a0f1a;
        }

        .btn-modal-cancel {
            padding: 6px 14px;
            border-radius: 6px;
            background: transparent;
            border: 1px solid var(--border-crisp);
            color: var(--text-secondary);
            font-size: 0.8rem;
            cursor: pointer;
        }

        .btn-modal-save {
            padding: 6px 16px;
            border-radius: 6px;
            background-color: #ef4444;
            border: none;
            color: #fff;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 120ms ease;
        }
        
        .btn-modal-save:hover {
            background-color: #dc2626;
        }

        /* Toast */
        .toast-shelf {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 2000;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .toast-unit {
            padding: 10px 14px;
            border-radius: 6px;
            background-color: #101624;
            border: 1px solid #202b3f;
            color: #fff;
            font-size: 0.8rem;
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }

    <!-- ======================= JAVASCRIPT LOGIC ======================= -->
    <script>
    (() => {
        'use strict';

        /* App State with Tab Persistence */
        function getInitialTab() {
            const hash = window.location.hash.replace('#', '').trim();
            if (['servers', 'manage-servers', 'clusters', 'sync', 'settings'].includes(hash)) {
                return hash;
            }
            const saved = localStorage.getItem('wb_active_tab');
            if (['servers', 'manage-servers', 'clusters', 'sync', 'settings'].includes(saved)) {
                return saved;
            }
            return 'servers';
        }

        let currentView = getInitialTab();
        let serverConfigs = []; // Source of truth: Cấu hình chuẩn từ backend
        let metricsMap = {};    // id -> latest metrics
        let systemGroups = [];
        let proxyList = [];     // Danh sách proxy từ backend
        let selectedCluster = localStorage.getItem('wb_selected_cluster') || 'all';
        let searchQuery = '';
        let currentGroupFilter = localStorage.getItem('wb_group_filter') || 'all';
        let editingServerId = null;

        let refreshIntervalMs = parseInt(localStorage.getItem('wb_refresh_interval')) || 1000;
        let lastRenderTime = 0;
        let wsConn = null;
        let wsBackoff = 1000;

        function showToast(text) {
            const shelf = document.getElementById('toast-shelf');
            const item = document.createElement('div');
            item.className = 'toast-unit';
            item.textContent = text;
            shelf.appendChild(item);
            setTimeout(() => item.remove(), 2800);
        }

        /* ================= Phiên bản & cập nhật ================= */
        let appVersionInfo = null;   // dữ liệu từ /api/version
        let updateInfoCache = null;  // dữ liệu từ /api/update/check

        /* Tải thông tin phiên bản + liên hệ, và kiểm tra cập nhật (không chặn UI) */
        async function initVersionInfo() {
            try {
                const res = await fetch('/api/version?t=' + Date.now());
                const data = await res.json();
                appVersionInfo = data;
                const textEl = document.getElementById('app-version-text');
                if (textEl) textEl.textContent = 'v' + (data.version || '—');
                const link = document.getElementById('btn-telegram-contact');
                if (link && data.telegram_url) link.href = data.telegram_url;
            } catch (e) {
                /* im lặng — không ảnh hưởng chức năng chính */
            }
            // Kiểm tra bản mới chạy nền (dùng cache 1h phía server, đỡ gọi GitHub liên tục)
            checkUpdate(false).catch(() => {});
        }

        /* Gọi API kiểm tra cập nhật (force=true để bỏ cache phía server) */
        async function checkUpdate(force) {
            const res = await fetch('/api/update/check' + (force ? '?force=1' : ''));
            const data = await res.json();
            updateInfoCache = data;
            renderVersionChip(data);
            renderAboutUpdateResult(data); // cập nhật luôn section Cài đặt nếu đang mở
            updateAboutBadge();
            return data;
        }

        /* Cập nhật chip phiên bản ở góc phải topbar */
        function renderVersionChip(info) {
            const chip = document.getElementById('app-version-chip');
            const textEl = document.getElementById('app-version-text');
            if (!chip || !textEl) return;
            const ver = (info && info.current_version) || (appVersionInfo && appVersionInfo.version) || '—';
            textEl.textContent = 'v' + ver;

            if (info && info.has_update) {
                chip.classList.add('has-update');
                const target = info.release_url || info.commit_url || info.repo_url || '';
                chip.title = 'Có bản mới: v' + (info.latest_version || '?') + ' — bấm để xem trên GitHub';
                chip.style.cursor = 'pointer';
                chip.onclick = () => {
                    if (target) window.open(target, '_blank', 'noopener');
                };
            } else {
                chip.classList.remove('has-update');
                chip.title = 'Phiên bản hiện tại: v' + ver;
                chip.style.cursor = 'default';
                chip.onclick = null;
            }
        }

        function formatNet(bps) {
            if (!bps || bps < 0) return '0 B/s';
            if (bps < 1024) return Math.round(bps) + ' B/s';
            if (bps < 1048576) return (bps / 1024).toFixed(1) + ' KB/s';
            if (bps < 1073741824) return (bps / 1048576).toFixed(2) + ' MB/s';
            return (bps / 1073741824).toFixed(2) + ' GB/s';
        }

        function formatRAM(mb) {
            if (!mb || mb <= 0) return '0 MB';
            if (mb >= 1024) {
                const gb = mb / 1024;
                return (gb >= 10 ? Math.round(gb) : gb.toFixed(1)) + 'GB';
            }
            return Math.round(mb) + 'MB';
        }

        function formatDiskUsed(used) {
            if (!used || used === '0') return '0G';
            return used;
        }

        // Subtext Memory/Disk: used / total / Free X (giá trị thật từ backend)
        function buildUsageText(used, total, freeStr) {
            if (!freeStr || freeStr === 'N/A') return `${used} / ${total}`;
            return `${used} / ${total} / Free ${freeStr}`;
        }

        function escapeHTML(s) {
            if (!s) return '';
            return String(s)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        /* Nạp danh sách Server từ Backend (Không phụ thuộc WebSocket delay) */
        async function refreshServerConfigs() {
            try {
                const res = await fetch('/api/servers?t=' + Date.now());
                const data = await res.json();
                serverConfigs = data.servers || [];
                document.getElementById('sb-count-manage').textContent = serverConfigs.length;
                renderViewContent();
            } catch (err) {
                console.error('Refresh server configs error:', err);
            }
        }

        /* Nạp danh sách Cụm từ Backend */
        async function fetchGroups() {
            try {
                const res = await fetch('/api/groups?t=' + Date.now());
                const data = await res.json();
                systemGroups = data.groups || [];
                updateClusterSelectors();
                document.getElementById('sb-count-groups').textContent = systemGroups.length;
            } catch (err) {
                console.error('Fetch groups err:', err);
            }
        }

        /* Nạp danh sách Proxy từ Backend */
        async function fetchProxies() {
            try {
                const res = await fetch('/api/proxies?t=' + Date.now());
                const data = await res.json();
                proxyList = data.proxies || [];
            } catch (err) {
                console.error('Fetch proxies err:', err);
            }
        }

        /* Tùy biến Topbar theo từng tab (Dynamic Header) */
        function updateTopbarForTab(tab) {
            const titleTag = document.getElementById('top-view-title');
            const dashControls = document.getElementById('topbar-dashboard-controls');
            const searchBox = document.getElementById('topbar-search-box');
            const dashActions = document.getElementById('topbar-dashboard-actions');
            const manageActions = document.getElementById('topbar-manage-actions');
            const clusterActions = document.getElementById('topbar-cluster-actions');

            if (tab === 'servers') {
                titleTag.textContent = 'DASHBOARD';
                dashControls.style.display = 'flex';
                searchBox.style.display = 'block';
                dashActions.style.display = 'flex';
                manageActions.style.display = 'none';
                clusterActions.style.display = 'none';
            } else if (tab === 'manage-servers') {

        function connectWebSocket() {
            const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
            wsConn = new WebSocket(`${proto}//${location.host}/ws`);

            wsConn.onopen = () => {
                wsBackoff = 1000;
                const dot = document.getElementById('wb-live-dot');
                if (dot) dot.className = 'live-dot';
                const status = document.getElementById('wb-live-status');
                if (status) status.textContent = 'Đã kết nối';
            };

            wsConn.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    if (msg.type === 'metrics') {
                        const arr = msg.data || [];
                        arr.forEach(m => {
                            metricsMap[m.id] = m;
                        });

                        const now = Date.now();
                        if (now - lastRenderTime >= (refreshIntervalMs - 80)) {
                            lastRenderTime = now;
                            if (currentView === 'servers') {
                                updateDashboardInPlace();
                            } else if (currentView === 'manage-servers') {
                                updateManageServersOSInPlace();
                            } else if (currentView === 'sync') {
                                updateSyncStatusInPlace();
                            }
                        }
                    }
                } catch (e) {
                    console.error('WS parse error:', e);
                }
            };

            wsConn.onclose = () => {
                const dot = document.getElementById('wb-live-dot');
                if (dot) dot.className = 'live-dot offline';
                const status = document.getElementById('wb-live-status');
                if (status) status.textContent = 'Mất kết nối';
                setTimeout(() => {
                    wsBackoff = Math.min(wsBackoff * 1.5, 30000);
                    connectWebSocket();
                }, wsBackoff);
            };

            wsConn.onerror = () => wsConn.close();
        }

            return list.map(cfg => {

        /* Update values in-place without rebuilding DOM */
        function updateDashboardInPlace() {
            const tbody = document.getElementById('dashboard-tbody');
            if (!tbody) return;

            const servers = getMergedServersList();
            const existingRows = tbody.querySelectorAll('.dashboard-row');
            if (existingRows.length !== servers.length) {
                renderServersView(document.getElementById('workbench-content-area'));
                return;
            }

            servers.forEach((s, idx) => {
                const row = existingRows[idx];
                if (!row || row.dataset.id !== s.id) {
                    renderServersView(document.getElementById('workbench-content-area'));
                    return;
                }

                const cpu = Math.max(0, Math.min(100, s.cpu_percent || 0));
                const ram = Math.max(0, Math.min(100, s.ram_percent || 0));
                const disk = Math.max(0, Math.min(100, s.disk_percent || 0));
                const isOnline = s.status === 'online';

                const dot = row.querySelector('.node-dot');
                if (dot) dot.className = `node-dot ${isOnline ? '' : 'offline'}`;

                const cpuVal = row.querySelector('.cpu-val');
                if (cpuVal) cpuVal.textContent = cpu.toFixed(1) + '%';
                const cpuCores = row.querySelector('.cpu-cores');
                if (cpuCores) cpuCores.textContent = s.cpu_cores ? s.cpu_cores + ' cores' : '';
                const cpuBar = row.querySelector('.metric-fill');
                if (cpuBar) {
                    cpuBar.style.width = cpu + '%';
                    cpuBar.className = `metric-fill ${cpu > 85 ? 'danger' : 'cpu'}`;
                }

                const ramPct = row.querySelector('.ram-pct');
                if (ramPct) ramPct.textContent = ram.toFixed(1) + '%';
                const ramMb = row.querySelector('.ram-mb');
                if (ramMb) ramMb.textContent = buildUsageText(formatRAM(s.ram_used_mb), formatRAM(s.ram_total_mb), s.ram_total_mb ? formatRAM(s.ram_free_mb) : '');
                const ramBar = row.querySelectorAll('.metric-fill')[1];
                if (ramBar) {
                    ramBar.style.width = ram + '%';
                    ramBar.className = `metric-fill ${ram > 85 ? 'danger' : 'mem'}`;
                }

                const diskPct = row.querySelector('.disk-pct');
                if (diskPct) diskPct.textContent = disk.toFixed(1) + '%';
                const diskGb = row.querySelector('.disk-gb');
                if (diskGb) diskGb.textContent = buildUsageText(formatDiskUsed(s.disk_used), formatDiskUsed(s.disk_total), formatDiskUsed(s.disk_avail));
                const diskBar = row.querySelectorAll('.metric-fill')[2];
                if (diskBar) {
                    diskBar.style.width = disk + '%';
                    diskBar.className = `metric-fill ${disk > 85 ? 'danger' : (disk > 70 ? 'disk' : 'disk-safe')}`;
                }

                const rxVal = row.querySelector('.rx-val');
                if (rxVal) rxVal.textContent = formatNet(s.net_rx_rate);
                const txVal = row.querySelector('.tx-val');
                if (txVal) txVal.textContent = formatNet(s.net_tx_rate);
                const ioReadVal = row.querySelector('.io-read-val');
                if (ioReadVal) ioReadVal.textContent = formatNet(s.io_read_rate);
                const ioWriteVal = row.querySelector('.io-write-val');
                if (ioWriteVal) ioWriteVal.textContent = formatNet(s.io_write_rate);
                const uptimeVal = row.querySelector('.uptime-val');
                if (uptimeVal) uptimeVal.textContent = s.uptime || 'N/A';
            });
        }

        /* Render 1 cột "Hệ điều hành / Kernel": OS dòng trên, kernel dòng dưới */
        function renderOSKernelCell(m) {
            if (!m || !m.os) {
                return `<span style="color: #64748b;">—</span>`;
            }
            const kernelLine = m.kernel
                ? `<div style="font-family: var(--font-mono); font-size: 0.78rem; color: #94a3b8; margin-top: 2px; white-space: nowrap;">${escapeHTML(m.kernel)}</div>`
                : '';
            return `<div style="font-size: 0.9rem; font-weight: 600; color: #e2e8f0; white-space: nowrap;">${escapeHTML(m.os)}</div>${kernelLine}`;
        }

        /* Render cột "CPU": in nguyên model gốc 1 dòng, tự xuống dòng khi dài */
        function renderCPUSpeedCell(m) {
            if (!m || !m.cpu_model) {
                return `<span style="color: #64748b;">—</span>`;
            }
            return `<div class="cpu-nowrap" style="font-size: 0.9rem; font-weight: 600; color: #e2e8f0; line-height: 1.35;">${escapeHTML(m.cpu_model)}</div>`;
        }

        /* Cập nhật cột Hệ điều hành / Kernel in-place khi có metrics mới qua WebSocket */
        function updateManageServersOSInPlace() {
            serverConfigs.forEach(s => {
                const m = metricsMap[s.id];
                if (!m) return;
                if (m.os) {
                    const cell = document.getElementById(`mgmt-oskernel-${s.id}`);
                    if (cell) {
                        cell.innerHTML = renderOSKernelCell(m);
                    }
                }
                if (m.cpu_model) {
                    const cpuCell = document.getElementById(`mgmt-cpu-${s.id}`);
                    if (cpuCell) {
                        cpuCell.innerHTML = renderCPUSpeedCell(m);
                    }
                }
            });
        }

        /* Logic Drag & Drop bằng chuột */
        let draggedRowEl = null;

        function bindTableDragAndDrop(tbody) {
            const rows = tbody.querySelectorAll('.draggable-row');
            rows.forEach(row => {
                const handle = row.querySelector('.drag-handle');
                if (!handle) return;

                handle.addEventListener('mousedown', () => {
                    row.setAttribute('draggable', 'true');
                });

                row.addEventListener('dragstart', (e) => {
                    draggedRowEl = row;
                    e.dataTransfer.effectAllowed = 'move';
                    e.dataTransfer.setData('text/plain', row.dataset.id);
                    row.classList.add('dragging');
                });

                row.addEventListener('dragend', () => {
                    row.removeAttribute('draggable');
                    row.classList.remove('dragging');
                    draggedRowEl = null;
                    document.querySelectorAll('.draggable-row').forEach(r => r.classList.remove('drag-over'));
                    saveReorderedServers();
                });

                row.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    e.dataTransfer.dropEffect = 'move';
                    const targetRow = row;
                    if (targetRow && targetRow !== draggedRowEl) {
                        const rect = targetRow.getBoundingClientRect();
                        const next = (e.clientY - rect.top) / (rect.bottom - rect.top) > 0.5;
                        tbody.insertBefore(draggedRowEl, next ? targetRow.nextSibling : targetRow);
                    }
                });
            });
        }

        /* Gửi thứ tự mới lên backend và lưu vào servers.json */
        async function saveReorderedServers() {
            const tbody = document.getElementById('servers-mgmt-tbody');
            if (!tbody) return;

            const rows = tbody.querySelectorAll('.draggable-row');
            const orderedIDs = Array.from(rows).map(r => r.dataset.id);
            if (orderedIDs.length === 0) return;

            // Reorder serverConfigs local memory immediately
            const cfgMap = {};
            serverConfigs.forEach(s => { cfgMap[s.id] = s; });
            serverConfigs = orderedIDs.map(id => cfgMap[id]).filter(Boolean);

            try {
                const res = await fetch('/api/servers/reorder', {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ordered_ids: orderedIDs })
                });
                if (!res.ok) throw new Error('Lỗi lưu thứ tự');
                showToast('Đã lưu thứ tự máy chủ mới');
            } catch (err) {
                showToast(err.message);
            }
        }

                                <button class="btn-more-dots" style="width: auto; padding: 0 10px; color: #f87171;" onclick="deleteGroup('${escapeHTML(g)}', ${count})" title="Xóa">🗑️</button>

            html += `</tbody></table></div>`;
            area.innerHTML = html;

            const tbody = document.getElementById('groups-mgmt-tbody');
            if (tbody) {
                bindGroupDragAndDrop(tbody);

        }

        /* Drag & Drop cho Group */
        let draggedGroupRowEl = null;

        function bindGroupDragAndDrop(tbody) {
            const rows = tbody.querySelectorAll('.draggable-group-row');
            rows.forEach(row => {
                const handle = row.querySelector('.drag-handle-group');
                if (!handle) return;

                handle.addEventListener('mousedown', () => {

                row.addEventListener('dragstart', (e) => {
                    draggedGroupRowEl = row;
